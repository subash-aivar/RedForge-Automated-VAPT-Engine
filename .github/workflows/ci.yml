name: Phase 1 checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: ruff check src tests migrations
      - run: pytest -q
      - run: alembic upgrade head
      - run: redforge-vapt scan --config engagements/demo.yaml --profile passive --fixture-dir fixtures/demo --report html,json
