[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redforge-vapt"
version = "0.1.0"
description = "Policy controlled VAPT orchestration with offline fixtures"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "SQLAlchemy>=2", "alembic>=1.13", "PyYAML>=6", "typer>=0.12", "rich>=13", "Jinja2>=3.1", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
pdf = ["weasyprint>=62"]

[project.scripts]
redforge-vapt = "redforge_vapt.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redforge_vapt = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
